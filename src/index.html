<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alrededor de los EE.UU.</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header">
        <img
          class="header__logo"
          src="./images/logo.svg"
          alt="Logotipo de Alrededor de los EE.UU."
        />
      </header>

      <main class="content">
        <section class="profile">
          <div class="profile__avatar-container">
            <img
              class="profile__avatar"
              src="./images/avatar.jpg"
              alt="Foto de perfil del usuario"
            />
            <button
              class="profile__avatar-edit-button"
              type="button"
              aria-label="Cambiar foto de perfil"
            ></button>
          </div>
          <div class="profile__info">
            <h1 class="profile__name">Jacques Cousteau</h1>
            <button
              class="profile__edit-button"
              type="button"
              aria-label="Editar perfil"
            ></button>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            class="profile__add-button"
            type="button"
            aria-label="Añadir tarjeta"
          ></button>
        </section>

        <section class="elements">
          <ul class="elements__list"></ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">&copy; 2026 Alrededor de los EE.UU.</p>
      </footer>
    </div>

    <div class="popup popup_type_edit-profile">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
        ></button>
        <h2 class="popup__title">Editar perfil</h2>
        <form class="popup__form" name="profile-form" novalidate>
          <input
            class="popup__input popup__input_type_name"
            type="text"
            name="name"
            placeholder="Nombre"
            aria-label="Nombre"
            required
            id="name-input"
            minlength="2"
            maxlength="40"
          />
          <span class="popup__error name-input-error"></span>
          <input
            class="popup__input popup__input_type_description"
            type="text"
            name="about"
            placeholder="Acerca de mí"
            aria-label="Acerca de mí"
            required
            id="description-input"
            minlength="2"
            maxlength="200"
          />
          <span class="popup__error description-input-error"></span>
          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_add-card">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
        ></button>
        <h2 class="popup__title">Nuevo lugar</h2>
        <form class="popup__form" name="card-form" novalidate>
          <input
            class="popup__input popup__input_type_card-name"
            type="text"
            name="name"
            placeholder="Título"
            aria-label="Título"
            required
            id="card-name-input"
            minlength="2"
            maxlength="30"
          />
          <span class="popup__error card-name-input-error"></span>
          <input
            class="popup__input popup__input_type_url"
            type="url"
            name="link"
            placeholder="Enlace a la imagen"
            aria-label="Enlace a la imagen"
            required
            id="url-input"
          />
          <span class="popup__error url-input-error"></span>
          <button class="popup__button" type="submit">Crear</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_avatar">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
        ></button>
        <h2 class="popup__title">Cambiar foto de perfil</h2>
        <form class="popup__form" name="avatar-form" novalidate>
          <input
            class="popup__input popup__input_type_url"
            type="url"
            name="avatar"
            placeholder="Enlace a la imagen"
            aria-label="Enlace a la imagen"
            required
            id="avatar-input"
          />
          <span class="popup__error avatar-input-error"></span>
          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_confirm">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
        ></button>
        <h2 class="popup__title popup__title_type_confirm">¿Estás seguro?</h2>
        <form class="popup__form" name="confirm-form" novalidate>
          <button
            class="popup__button popup__button_type_confirm"
            type="submit"
          >Sí</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_image">
      <figure class="popup__figure">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar"
        ></button>
        <img class="popup__image" src="#" alt="" />
        <figcaption class="popup__caption"></figcaption>
      </figure>
    </div>

    <template id="card-template">
      <li class="card">
        <img class="card__image" src="#" alt="" />
        <button
          class="card__delete-button"
          type="button"
          aria-label="Eliminar"
        ></button>
        <div class="card__info">
          <h2 class="card__title"></h2>
          <button
            class="card__like-button"
            type="button"
            aria-label="Me gusta"
          ></button>
        </div>
      </li>
    </template>

    <script type="module" src="./pages/index.js"></script>
  </body>
</html>
